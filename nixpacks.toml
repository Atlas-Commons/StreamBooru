# StreamBooru sync server — Coolify / Nixpacks (Bun runtime)
# Coolify "Base Directory": / (repository root)

[phases.setup]
nixPkgs = ['curl', 'unzip']
aptPkgs = ['build-essential']
cmds = [
    # Pinned: an unpinned install upgraded the runtime under a deploy that changed no
    # code, and 1.3 started handing an entrypoint's `app` export to Bun.serve().
    "curl -fsSL https://bun.sh/install | bash -s bun-v1.3.14",
    "cp /root/.bun/bin/bun /usr/bin/bun",
    "chmod +x /usr/bin/bun"
]

[phases.install]
cmds = ['cd server && bun install --ignore-scripts']

[phases.build]
cmds = ['bun scripts/build-webapp.mjs']

[start]
cmd = 'cd server && bun run start:prod'
