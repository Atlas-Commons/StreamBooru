      <stop offset="0" stop-color="#22e3ff"/>
      <stop offset="1" stop-color="#ff2fb0"/>
    </linearGradient>
    <linearGradient id="word-grad" gradientUnits="userSpaceOnUse" x1="330" y1="120" x2="830" y2="190">
      <stop offset="0" stop-color="#22e3ff"/>
      <stop offset="1" stop-color="#ff2fb0"/>
