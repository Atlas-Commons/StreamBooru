appId: io.streambooru.StreamBooru
productName: StreamBooru

directories:
  output: dist
  buildResources: build

files:
  - "electron/**"
  - "renderer/**"
  - "src/**"
  - "package.json"
  - "!node_modules/.cache"

asar: true

linux:
  category: Utility
  target:
    - deb
    - tar.gz
  maintainer: "Atlas Commons <mrhowe95@gmail.com>"
  vendor: "StreamBooru Project"
  # Wayland takes a window's icon from the desktop file matching its app_id rather than
  # from the window itself, and Electron reports app_id "streambooru". Keep the desktop
  # filename tied to that, and name the class outright for the compositors that match on
  # it, or the launcher falls back to a generic icon.
  syncDesktopName: true
  # A lone 1024px source installs a lone 1024px icon, which panels and task switchers
  # have to downscale on every draw. Ship the sizes an icon theme expects.
  icon: build/icons
  desktop:
    entry:
      Name: StreamBooru
      StartupWMClass: streambooru
      Keywords: booru;danbooru;gelbooru;e621;images;

deb:
  depends:
    - libgtk-3-0
    - libnss3
    - libasound2
    - libxss1
    - libxtst6
  synopsis: StreamBooru
  description: "StreamBooru - multi-site booru browser (Electron)."

win:
  target:
    - nsis
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  artifactName: "${productName}-Setup-${version}.${ext}"

extraMetadata:
  name: streambooru

flatpak:
  license: LICENSE
  runtime: org.freedesktop.Platform
  runtimeVersion: "24.08"
  sdk: org.freedesktop.Sdk
  base: org.electronjs.Electron2.BaseApp
  baseVersion: "24.08"
  finishArgs:
    - --share=ipc
    - --socket=fallback-x11
    - --socket=wayland
    - --device=dri
    - --share=network
    - --filesystem=home
    - --filesystem=xdg-download
  mimeTypes:
    - x-scheme-handler/http
    - x-scheme-handler/https
